<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>

<body>

    <!-- School Name -->
    <h1>ABC Senior Secondary School</h1>

    <h2>Student Report Card</h2>

    <table border="1">

        <!-- Table Heading -->
        <tr>
            <th colspan="4" title="Student Academic Report">
                Academic Performance
            </th>
        </tr>

        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
            <th>Grade</th>
        </tr>

        <!-- Subject Marks -->
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>85</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>88</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>95</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
        </tr>

        <!-- Total and Percentage -->
        <tr>
            <th colspan="2">Total</th>
            <td colspan="2">440 / 500</td>
        </tr>

        <tr>
            <th rowspan="1" title="Final Percentage">
                Percentage
            </th>
            <td colspan="3">88%</td>
        </tr>

    </table>

    <p>
        <strong>Result:</strong> Passed with excellent performance.
    </p>

</body>
</html>
